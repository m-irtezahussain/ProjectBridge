[project]
name = "projectbridge-backend"
version = "0.1.0"
description = "Shared FastAPI and MCP backend for ProjectBridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi[standard]>=0.121,<1",
  "mcp[cli]>=2,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.11,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

